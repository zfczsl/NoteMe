<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清除 NoteMe 缓存</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#F7F7F8;color:#1A1A1A;}
  .box{background:#fff;padding:2rem;border-radius:18px;box-shadow:0 4px 24px rgba(0,0,0,.08);max-width:420px;text-align:center;}
  h1{font-size:1.25rem;margin:0 0 .5rem;}
  p{margin:.5rem 0;color:#6B7280;font-size:.9rem;line-height:1.6;}
  .status{font-weight:700;color:#FF4D6D;margin-top:1rem;}
  button{margin-top:1rem;padding:.7rem 1.4rem;border:none;border-radius:12px;background:#FF4D6D;color:#fff;font-size:.95rem;cursor:pointer;}
</style>
</head>
<body>
<div class="box">
  <h1>正在强制清理本地缓存…</h1>
  <p>这会注销旧的 Service Worker、清空缓存，并跳转回首页。</p>
  <div class="status" id="status">处理中</div>
  <button id="retry" style="display:none;" onclick="location.reload()">再试一次</button>
</div>
<script>
  async function clean() {
    const status = document.getElementById('status');
    try {
      // 1. 注销所有 Service Worker
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        for (const reg of regs) {
          await reg.unregister();
        }
      }
      // 2. 清空所有 Cache Storage
      if ('caches' in window) {
        const keys = await caches.keys();
        for (const key of keys) {
          await caches.delete(key);
        }
      }
      // 3. 可选：清空部分 localStorage（保留用户数据）
      // 不删除 daywise_todos 等数据，只清可能冲突的登录态
      status.textContent = '清理完成，即将跳转到首页';
      setTimeout(() => {
        window.location.href = '/?nocache=' + Date.now();
      }, 800);
    } catch (e) {
      status.textContent = '清理出错：' + e.message;
      document.getElementById('retry').style.display = 'inline-block';
    }
  }
  clean();
</script>
</body>
</html>
